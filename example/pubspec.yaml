name: story_creator_kit_example
description: "Demonstrates how to use the story_creator_kit plugin."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  story_creator_kit:
    # When depending on this package from a real application you should use:
    #   story_creator_kit: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  video_player: ^2.14.0
  path_provider: ^2.1.6
  device_info_plus: ^13.2.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Sample assets. Music and stickers are generated by
  # tool/generate_sample_assets.dart (CC0); fonts are SIL OFL from
  # github.com/google/fonts. See assets/ASSETS_LICENSE.md.
  assets:
    - assets/music/
    - assets/stickers/
    # Clip returned by the simulated camera on the iOS Simulator.
    - assets/sim/
    # --- integration-test fixtures (owned by the export/QA area) ---
    # Synthetic clips from integration_test/tool/make_fixtures.swift; used
    # only by integration_test/export_matrix_test.dart.
    - integration_test/assets/
    # --- end integration-test fixtures ---

  # Inter and Playfair Display are variable fonts: select heavier weights
  # with `FontVariation('wght', 700)` rather than FontWeight alone.
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
