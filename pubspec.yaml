name: story_creator_kit
description: >-
  Instagram-style story creator for Flutter: camera, gallery, text, drawing,
  stickers, filters, music and native photo/video export on iOS and Android.
version: 0.2.0
homepage: https://github.com/Hpetrosyan99/story_creator_kit
repository: https://github.com/Hpetrosyan99/story_creator_kit
issue_tracker: https://github.com/Hpetrosyan99/story_creator_kit/issues
topics:
  - story
  - camera
  - video-editor
  - image-editor
  - media

environment:
  sdk: ^3.13.1
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  audio_session: ^0.2.4
  camera: ^0.12.1
  gal: ^2.3.3
  image_picker: ^1.2.3
  just_audio: ^0.10.6
  material_color_utilities: ^0.13.0
  meta: ^1.16.0
  path_provider: ^2.1.5
  perfect_freehand: ^2.5.2
  permission_handler: ^13.0.2
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  video_player: ^2.14.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  camera_platform_interface: ^2.10.0
  mocktail: ^1.0.4
  pigeon: ^29.0.0
  plugin_platform_interface: ^2.1.8
  video_player_platform_interface: ^6.4.0

flutter:
  assets:
    - assets/icons/
  plugin:
    platforms:
      android:
        package: com.mabrook.story_creator_kit
        pluginClass: StoryCreatorKitPlugin
      ios:
        pluginClass: StoryCreatorKitPlugin
