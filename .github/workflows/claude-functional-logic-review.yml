name: Claude Functional Logic Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-functional-logic-review:
    if: |
      contains(github.event.pull_request.title, '[functional-logic-review]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # flutter analyze needs resolved packages for the plugin and the example.
      - name: Resolve packages
        run: |
          flutter pub get
          (cd example && flutter pub get)

      - name: Run Claude Functional Logic Review
        id: claude-functional-logic-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/review-functional-logic ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github__get_pull_request,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(gh issue view:*),Bash(flutter analyze:*),Read,Grep,Glob"
            --model claude-sonnet-4-5
            --max-turns 20
