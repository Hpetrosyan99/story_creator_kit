name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Generated Pigeon code (lib/src/native) is excluded: its formatting
      # depends on the SDK version that ran the formatter.
      - run: find lib test example/lib example/integration_test pigeons -name '*.dart' -not -path 'lib/src/native/*' -print0 | xargs -0 dart format --output=none --set-exit-if-changed
      - run: flutter analyze
      - run: (cd example && flutter analyze)
      # Goldens are macOS-rendered; they run in the ios job.
      - run: flutter test --exclude-tags golden
      - run: ./tool/sync_agents.sh --check
      - run: dart pub publish --dry-run

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: (cd example && flutter build apk --debug)

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter test --tags golden
      - run: (cd example && flutter build ios --simulator --debug)
